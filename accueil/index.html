<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAV OK-LA</title>
<meta name="theme-color" content="#7a4a2b">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon-192.png">
<style>
  :root {
    --brown-900: #3a2416; --brown-700: #5c3820; --brown-500: #7a4a2b; --brown-100: #f4ece3;
    --cream: #fbf7f1; --orange: #d97b3f; --teal-900: #1f5c5c;
    --gray-500: #8a8074;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(58, 36, 22, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--cream); color: var(--brown-900); line-height: 1.45;
    min-height: 100vh;
  }
  header { text-align: center; padding: 40px 20px 10px; }
  header h1 { margin: 0; font-size: 1.5rem; color: var(--brown-700); }
  header p { color: var(--gray-500); font-size: 0.92rem; margin: 8px 0 0; }
  main {
    max-width: 900px; margin: 0 auto; padding: 30px 20px 50px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;
  }
  a.tile {
    display: block; text-decoration: none; color: white; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 30px 24px; position: relative; overflow: hidden;
    transition: transform 0.15s ease;
  }
  a.tile:hover { transform: translateY(-3px); }
  a.tile .icon { font-size: 2.2rem; margin-bottom: 14px; display: block; }
  a.tile h2 { margin: 0 0 6px; font-size: 1.2rem; }
  a.tile p { margin: 0; font-size: 0.86rem; opacity: 0.92; }
  a.tile.client { background: linear-gradient(160deg, var(--orange), #b8622c); }
  a.tile.gestion { background: linear-gradient(160deg, #5c3820, var(--brown-900)); }
  a.tile.magasin { background: linear-gradient(160deg, #2a7a7a, var(--teal-900)); }
  footer { text-align: center; padding: 20px; color: var(--gray-500); font-size: 0.78rem; }
</style>
</head>
<body>

<header>
  <h1>SAV OK-LA</h1>
  <p>Choisissez votre espace</p>
</header>

<main>
  <a class="tile client" href="../">
    <span class="icon">🛋️</span>
    <h2>Espace client</h2>
    <p>Déclarer un problème sur un meuble.</p>
  </a>
  <a class="tile gestion" href="../gestion/">
    <span class="icon">🗂️</span>
    <h2>Espace gestion</h2>
    <p>Émilie / Antoine — suivi et traitement complet des dossiers.</p>
  </a>
  <a class="tile magasin" href="../magasin/">
    <span class="icon">🏬</span>
    <h2>Espace magasin</h2>
    <p>Équipes en magasin — suivi et validation à la clôture.</p>
  </a>
</main>

<footer>Usage interne OK-LA</footer>

</body>
</html>
